<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks — 회의록 · 과제 관리</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090c10;--surface:#0d1117;--surface2:#161b22;--surface3:#21262d;
  --border:#30363d;--border2:#21262d;
  --text:#f0f6fc;--text2:#c9d1d9;--muted:#8b949e;--muted2:#484f58;
  --accent:#58a6ff;--accent2:#79c0ff;
  --green:#3fb950;--orange:#d2991d;--red:#f85149;--purple:#bc8cff;--pink:#db61a2;
  --radius:8px;--radius-sm:6px;--radius-lg:12px;
  --sw:280px;--dw:420px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
  --mono:'SF Mono','JetBrains Mono','Cascadia Code',monospace;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;
  display:flex;flex-direction:column}

/* ── Top Nav ── */
#topnav{display:flex;align-items:center;padding:0 20px;height:46px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;z-index:20;gap:2px}
#topnav .brand{font-size:13px;font-weight:700;color:var(--text);margin-right:20px;letter-spacing:-.2px}
#topnav .tnav{font-size:12px;font-weight:600;padding:6px 14px;border-radius:var(--radius-sm);
  cursor:pointer;color:var(--muted);transition:all .15s;white-space:nowrap;
  display:flex;align-items:center;gap:6px}
#topnav .tnav:hover{color:var(--text2);background:var(--surface2)}
#topnav .tnav.active{color:var(--text);background:var(--surface2)}
#topnav .tnav .badge{font-size:10px;background:var(--accent);color:#fff;border-radius:8px;
  padding:0 6px;font-weight:700;line-height:16px}

/* ── Body ── */
#app-body{flex:1;display:flex;overflow:hidden}

/* ── Sidebar ── */
#sidebar{width:var(--sw);background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sb-section{padding:12px 14px 4px;flex-shrink:0}
.sb-section-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:1px;padding:0 6px;margin-bottom:4px}
.sb-list{flex:1;overflow-y:auto;padding:4px 10px 12px}
.sb-item{padding:9px 10px;border-radius:var(--radius);cursor:pointer;transition:all .12s;margin-bottom:1px;
  border:1px solid transparent}
.sb-item:hover{background:var(--surface2)}
.sb-item.active{background:var(--surface2);border-color:var(--accent)}
.sb-item .i-title{font-size:12px;font-weight:500;line-height:1.4}
.sb-item .i-meta{font-size:10px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center}
.sb-item .i-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sb-item.completed{opacity:.5}
.sb-item.completed .i-title{text-decoration:line-through}
.sb-empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:11px}

.sb-footer{padding:8px 14px;border-top:1px solid var(--border2);flex-shrink:0;font-size:10px;
  color:var(--muted);display:flex;align-items:center;gap:6px}
.sb-footer .live{width:5px;height:5px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Main ── */
#main{flex:1;display:flex;overflow:hidden;min-width:0}
#list-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#detail-panel{width:var(--dw);border-left:1px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;overflow:hidden;transition:all .2s;flex-shrink:0}
#detail-panel.collapsed{width:0;opacity:0;border-left:none}

/* ── List header ── */
.list-header{padding:16px 24px;border-bottom:1px solid var(--border2);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between}
.list-header h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.list-header .count{font-size:11px;color:var(--muted);font-weight:400}
.btn{font-size:11px;font-weight:600;padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .12s;
  display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--surface3);border-color:var(--muted2);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.sm{padding:3px 8px;font-size:10px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--surface2)}

/* ── Table ── */
.table-wrap{flex:1;overflow-y:auto}
.table{width:100%;border-collapse:collapse}
.table th{position:sticky;top:0;background:var(--bg);font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.8px;padding:10px 16px;text-align:left;
  border-bottom:1px solid var(--border2);z-index:2;white-space:nowrap}
.table td{padding:11px 16px;border-bottom:1px solid var(--border2);font-size:13px;vertical-align:middle}
.table tr{cursor:pointer;transition:all .1s}
.table tr:hover td{background:var(--surface2)}
.table tr.selected td{background:var(--surface2)}
.table tr.completed td{opacity:.5}
.table tr.completed .tt-c{text-decoration:line-through}
.table .tid{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}
.table .meet-link{font-size:10px;color:var(--accent2);cursor:pointer;text-decoration:underline}
.table .meet-link:hover{color:var(--accent)}

/* inline edit */
.editable{cursor:pointer;padding:1px 4px;margin:-1px -4px;border-radius:3px;transition:all .1s}
.editable:hover{background:var(--surface3)}

/* status */
.sbdg{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:99px;font-size:11px;
  font-weight:600;cursor:pointer;transition:all .1s;border:1px solid transparent}
.sbdg.wait{background:rgba(210,153,29,.12);color:var(--orange);border-color:rgba(210,153,29,.25)}
.sbdg.progress{background:rgba(88,166,255,.12);color:var(--accent);border-color:rgba(88,166,255,.25)}
.sbdg.done{background:rgba(63,185,80,.12);color:var(--green);border-color:rgba(63,185,80,.25)}
.sbdg.hold{background:rgba(139,148,158,.12);color:var(--muted);border-color:rgba(139,148,158,.25)}
.sbdg:hover{filter:brightness(1.3)}

.pribdg{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px}
.pri-high{background:rgba(248,81,73,.15);color:var(--red)}
.pri-mid{background:rgba(210,153,29,.15);color:var(--orange)}
.pri-low{background:rgba(139,148,158,.15);color:var(--muted)}

/* ── Detail panel ── */
.detail-header{padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between}
.detail-header h4{font-size:14px;font-weight:600}
.detail-close{width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--border2);
  background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:16px;transition:all .1s}
.detail-close:hover{background:var(--surface3);color:var(--text)}
.detail-body{flex:1;overflow-y:auto;padding:18px 20px}

.detail-body h5{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;margin:20px 0 8px}
.detail-body h5:first-child{margin-top:0}
.detail-field{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);
  padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.detail-field:hover{border-color:var(--border)}
.detail-field .flabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  min-width:48px;flex-shrink:0}
.detail-field .fvalue{flex:1;font-size:13px;cursor:pointer;padding:2px 4px;margin:-2px -4px;
  border-radius:3px;transition:all .1s}
.detail-field .fvalue:hover{background:var(--surface3)}
.detail-field select{font-family:var(--font);font-size:13px;background:var(--surface3);
  color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:5px 8px;outline:none;width:100%}
.detail-field input{font-family:var(--font);font-size:13px;background:var(--surface3);
  color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:6px 8px;outline:none;width:100%}

/* linked meeting */
.linked-meet{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(88,166,255,.06);
  border:1px solid rgba(88,166,255,.15);border-radius:var(--radius-sm);cursor:pointer;
  transition:all .1s;font-size:12px;margin-top:6px}
.linked-meet:hover{background:rgba(88,166,255,.12);border-color:var(--accent)}

/* timeline */
.tl{position:relative;padding-left:14px;margin-top:6px}
.tl::before{content:'';position:absolute;left:4px;top:2px;bottom:2px;width:1px;background:var(--border2)}
.tl-item{position:relative;padding:4px 0 4px 16px;font-size:11px}
.tl-item::before{content:'';position:absolute;left:-11px;top:8px;width:5px;height:5px;border-radius:50%;
  background:var(--accent);border:1px solid var(--surface)}
.tl-time{font-family:var(--mono);font-size:10px;color:var(--muted2)}
.tl-note{color:var(--muted);font-size:10px;margin-top:2px;line-height:1.5}
.note-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);
  color:var(--text);padding:10px 12px;font-family:var(--font);font-size:12px;resize:vertical;
  min-height:60px;outline:none;margin-top:8px}
.note-input:focus{border-color:var(--accent)}

/* ── Meeting list view ── */
.meet-card{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);
  padding:14px 18px;cursor:pointer;transition:all .12s;margin-bottom:8px;
  display:flex;align-items:center;gap:14px}
.meet-card:hover{border-color:var(--border)}
.meet-card.active{border-color:var(--accent);background:var(--surface2)}
.meet-card .mc-icon{font-size:24px;flex-shrink:0}
.meet-card .mc-body{flex:1;min-width:0}
.meet-card .mc-date{font-size:10px;color:var(--muted)}
.meet-card .mc-title{font-size:14px;font-weight:600;margin-top:2px}
.meet-card .mc-meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:12px}
.meet-card .mc-tasks{font-size:10px;background:var(--surface3);padding:3px 8px;border-radius:99px;
  color:var(--accent);font-weight:600;white-space:nowrap;flex-shrink:0}

/* meeting detail inline */
.meet-detail-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.meet-detail-header h4{font-size:15px;font-weight:700}
.meta-tags{display:flex;gap:6px;flex-wrap:wrap}
.mtag{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);
  padding:4px 10px;font-size:11px;color:var(--muted)}
.mtag span{color:var(--text);margin-left:3px}
.sum-list{list-style:none}
.sum-list li{padding:6px 0;border-bottom:1px solid var(--border2);font-size:12px;display:flex;gap:6px}
.sum-list li:last-child{border-bottom:none}
.sum-list li::before{content:'▸';color:var(--accent2);font-size:10px;margin-top:3px;flex-shrink:0}

/* toast */
#toast{position:fixed;bottom:20px;right:20px;background:var(--surface3);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 18px;font-size:12px;color:var(--text);z-index:1000;
  transform:translateY(80px);opacity:0;transition:all .2s}
#toast.show{transform:translateY(0);opacity:1}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;
  align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:24px;width:400px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal h4{font-size:15px;font-weight:700;margin-bottom:16px}
.modal label{display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:4px;margin-top:10px}
.modal input,.modal select{width:100%;font-family:var(--font);font-size:13px;background:var(--surface2);
  color:var(--text);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--accent)}
.modal .btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

/* ── Mobile ── */
.menu-btn{display:none;position:fixed;top:10px;left:10px;z-index:30;width:32px;height:32px;
  border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border);
  cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:3px}
.menu-btn span{width:14px;height:1.5px;background:var(--text);border-radius:1px}
@media(max-width:900px){
  :root{--sw:0px;--dw:0px}
  #sidebar{position:fixed;left:0;top:46px;bottom:0;width:280px;transform:translateX(-100%);
    transition:transform .2s;z-index:15}
  #sidebar.open{transform:translateX(0)}
  #detail-panel{position:fixed;right:0;top:46px;bottom:0;width:100vw;z-index:15;border-left:none}
  #detail-panel.collapsed{width:0}
  #list-panel{padding-top:0}
  .menu-btn{display:flex}
  .hm{display:none!important}
}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
</style>
</head>
<body>

<!-- Top Nav -->
<nav id="topnav">
  <span class="brand">📋 Tasks</span>
  <span class="tnav active" id="tn-task" onclick="switchTab('task')">📊 과제</span>
  <span class="tnav" id="tn-meet" onclick="switchTab('meet')">📝 회의록 <span class="badge" id="meetBadge" style="display:none"></span></span>
</nav>

<div class="menu-btn" id="menuBtn" onclick="toggleMenu()"><span></span><span></span><span></span></div>

<div id="app-body">
  <!-- Sidebar -->
  <nav id="sidebar" class="open">
    <div id="sbContent"></div>
    <div class="sb-footer"><span class="live"></span> Hermes 연결됨</div>
  </nav>

  <!-- Main -->
  <div id="main">
    <div id="list-panel">
      <div id="listHeader"></div>
      <div class="table-wrap" id="listContent"></div>
    </div>
    <div id="detail-panel" class="collapsed">
      <div class="detail-header">
        <h4 id="detailTitle">상세</h4>
        <button class="detail-close" onclick="closeDetail()">✕</button>
      </div>
      <div class="detail-body" id="detailBody"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Add task modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h4>➕ 새 과제</h4>
    <label>과제명</label><input id="addTitle" placeholder="과제 제목">
    <label>담당자</label><input id="addAssignee" placeholder="예: 홍길동">
    <label>목표일</label><input id="addDue" type="date">
    <label>우선순위</label>
    <select id="addPriority"><option>보통</option><option>높음</option><option>낮음</option></select>
    <div class="btns">
      <button class="btn" onclick="closeModal('addModal')">취소</button>
      <button class="btn primary" onclick="addTask()">추가</button>
    </div>
  </div>
</div>

<script>
// ── State ──
let TASKS = [], MEETINGS = [], MEET_HTML = {};
let EDIT = {};
let TAB = 'task';
let SEL = null; // selected task or meeting id
let FILTER = { task: 'all', meet: 'all' };

const SKEY = 'tasks-v4';
const STATUSES = ['대기중','진행중','완료','보류'];

function l() { try{EDIT=JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){EDIT={}}}
function s() { localStorage.setItem(SKEY, JSON.stringify(EDIT)); }
function apply(t) { const e=EDIT[t.id]||{}; return {...t,...e,_h:[...(t._h||[]),...(e._ha||[])]}; }

// ── Boot ──
async function boot() {
  l();
  try {
    const wbs = await (await fetch('wbs.json?'+Date.now())).json();
    TASKS = (wbs.tasks||[]).map(t=>({...t,_h:[{t:t.meeting_date||t.meeting_id||'?',a:'등록',n:''}]}));
  } catch(e) { TASKS = []; }

  // Discover meetings from wbs.json meeting references + linked tasks
  const meetIds = new Set();
  TASKS.forEach(t => { if (t.meeting_id) meetIds.add(t.meeting_id); if (t.meeting_date) meetIds.add(t.meeting_date); });
  
  // Also try to load meeting HTML files
  for (const id of meetIds) {
    try {
      MEET_HTML[id] = await (await fetch(id+'.html?'+Date.now())).text();
    } catch(e) {}
  }

  MEETINGS = [...meetIds].map(id => {
    const tasks = TASKS.filter(t => (t.meeting_id||t.meeting_date)===id);
    let date='', participants='', topics='', summary=[];
    if (MEET_HTML[id]) {
      const p = new DOMParser().parseFromString(MEET_HTML[id],'text/html');
      date = p.querySelector('.meta-item:nth-child(1)')?.textContent?.replace(/.*일시/,'').trim() || id.replace(/_/g,' ');
      participants = p.querySelector('.meta-item:nth-child(2)')?.textContent?.replace(/.*참여자/,'').trim()||'';
      topics = p.querySelector('.meta-item:nth-child(3)')?.textContent?.replace(/.*주제/,'').trim()||'';
      summary = [...p.querySelectorAll('.box li')].map(li=>li.textContent.trim());
    }
    return {id,date,participants,topics,summary,tasks};
  });
  MEETINGS.sort((a,b)=>b.id.localeCompare(a.id));

  document.getElementById('meetBadge').textContent = MEETINGS.length;
  document.getElementById('meetBadge').style.display = MEETINGS.length?'':'none';

  render();
}

// ── Tab switch ──
function switchTab(tab) {
  TAB = tab; SEL = null;
  document.getElementById('tn-task').classList.toggle('active', tab==='task');
  document.getElementById('tn-meet').classList.toggle('active', tab==='meet');
  document.getElementById('detail-panel').classList.add('collapsed');
  render();
}

// ── Render ──
function render() {
  if (TAB==='task') renderTaskSidebar(), renderTaskList();
  else renderMeetSidebar(), renderMeetList();
  updateDetail();
}

// ── Task sidebar ──
function renderTaskSidebar() {
  const all = TASKS.map(apply);
  const s = { total:all.length, done:all.filter(t=>t.status==='완료').length,
    ing:all.filter(t=>t.status==='진행중').length, wait:all.filter(t=>t.status==='대기중').length };
  document.getElementById('sbContent').innerHTML = `
    <div class="sb-section">
      <div class="sb-section-title">과제 현황</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px">
        <div style="text-align:center;padding:6px;background:var(--surface2);border-radius:var(--radius-sm)">
          <div style="font-size:16px;font-weight:800;color:var(--text2)">${s.total}</div>
          <div style="font-size:8px;color:var(--muted)">전체</div></div>
        <div style="text-align:center;padding:6px;background:var(--surface2);border-radius:var(--radius-sm)">
          <div style="font-size:16px;font-weight:800;color:var(--accent)">${s.ing}</div>
          <div style="font-size:8px;color:var(--muted)">진행중</div></div>
        <div style="text-align:center;padding:6px;background:var(--surface2);border-radius:var(--radius-sm)">
          <div style="font-size:16px;font-weight:800;color:var(--orange)">${s.wait}</div>
          <div style="font-size:8px;color:var(--muted)">대기중</div></div>
        <div style="text-align:center;padding:6px;background:var(--surface2);border-radius:var(--radius-sm)">
          <div style="font-size:16px;font-weight:800;color:var(--green)">${s.done}</div>
          <div style="font-size:8px;color:var(--muted)">완료</div></div>
      </div>
    </div>
    <div class="sb-section"><div class="sb-section-title">필터</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        ${['all','대기중','진행중','완료'].map(f=>`<button class="btn sm ${FILTER.task===f?'primary':''}" onclick="setTaskFilter('${f}')">${f==='all'?'전체':f}</button>`).join('')}
      </div>
    </div>
    <div class="sb-list" id="taskSBNav"></div>`;

  const list = FILTER.task==='all'?all:all.filter(t=>t.status===FILTER.task);
  const colors = {진행중:'var(--accent)',대기중:'var(--orange)',완료:'var(--green)',보류:'var(--muted)'};
  document.getElementById('taskSBNav').innerHTML = list.length===0
    ? '<div class="sb-empty">📭 없음</div>'
    : list.slice(0,50).map(t=>`
      <div class="sb-item${SEL===t.id?' active':''}${t.status==='완료'?' completed':''}" onclick="selectTask('${t.id}')">
        <div class="i-title">${esc(t.title)}</div>
        <div class="i-meta">
          <span class="i-dot" style="background:${colors[t.status]||'var(--muted)'}"></span>
          ${t.status} · ${esc(t.assignee)}
        </div>
      </div>`).join('');
}

// ── Task list ──
function renderTaskList() {
  const all = TASKS.map(apply);
  const list = FILTER.task==='all'?all:all.filter(t=>t.status===FILTER.task);
  document.getElementById('listHeader').innerHTML = `
    <h3>📊 ${FILTER.task==='all'?'전체 과제':FILTER.task} <span class="count">${list.length}건</span></h3>
    <button class="btn primary" onclick="showModal('addModal')">+ 새 과제</button>`;
  document.getElementById('listContent').innerHTML = `
    <table class="table"><thead><tr>
      <th style="width:55px">ID</th><th>과제명</th><th style="width:75px">담당자</th>
      <th class="hm" style="width:85px">마감일</th><th class="hm" style="width:140px">출처 회의</th>
      <th style="width:85px">상태</th>
    </tr></thead><tbody>
      ${list.length===0
        ? `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--muted)">과제 없음</td></tr>`
        : list.map(t=>{
          const mid = t.meeting_id||t.meeting_date;
          const meet = mid ? MEETINGS.find(m=>m.id===mid) : null;
          return `<tr class="${t.status==='완료'?'completed':''}${SEL===t.id?' selected':''}" onclick="selectTask('${t.id}')">
            <td class="tid">${t.id}</td>
            <td class="tt-c">${esc(t.title)}</td>
            <td><span class="editable" onclick="event.stopPropagation();inlineEdit('${t.id}','assignee')">${esc(t.assignee)}</span></td>
            <td class="hm"><span class="editable" onclick="event.stopPropagation();inlineEdit('${t.id}','due_date')">${t.due_date||'미정'}</span></td>
            <td class="hm">${meet
              ? `<span class="meet-link" onclick="event.stopPropagation();switchTab('meet');selectMeet('${meet.id}')">📋 ${(meet.date||meet.id).slice(0,16)}</span>`
              : '<span style="color:var(--muted2)">-</span>'}</td>
            <td>${statusBadge(t)}</td>
          </tr>`;
        }).join('')}
    </tbody></table>`;
}

// ── Meet sidebar ──
function renderMeetSidebar() {
  document.getElementById('sbContent').innerHTML = `
    <div class="sb-section"><div class="sb-section-title">회의록 (${MEETINGS.length}건)</div></div>
    <div class="sb-list" id="meetSBNav">
      ${MEETINGS.length===0
        ? '<div class="sb-empty">📭 회의록 없음</div>'
        : MEETINGS.map(m=>`
          <div class="sb-item${SEL===m.id?' active':''}" onclick="selectMeet('${m.id}')">
            <div class="i-title">📋 ${esc(m.date||m.id.replace(/_/g,' '))}</div>
            <div class="i-meta">${esc(m.topics||'')} · 과제 ${m.tasks.length}건</div>
          </div>`).join('')}
    </div>`;
}

// ── Meet list ──
function renderMeetList() {
  document.getElementById('listHeader').innerHTML = `
    <h3>📝 회의록 <span class="count">${MEETINGS.length}건</span></h3>
    <span></span>`;
  document.getElementById('listContent').innerHTML = MEETINGS.length===0
    ? '<div style="padding:60px;text-align:center;color:var(--muted)">아직 등록된 회의록이 없습니다</div>'
    : MEETINGS.map(m=>`
      <div class="meet-card${SEL===m.id?' active':''}" onclick="selectMeet('${m.id}')">
        <div class="mc-icon">📋</div>
        <div class="mc-body">
          <div class="mc-date">${esc(m.date||m.id.replace(/_/g,' '))}</div>
          <div class="mc-title">${esc(m.topics||'회의')}</div>
          <div class="mc-meta"><span>👥 ${esc(m.participants||'')}</span></div>
        </div>
        <div class="mc-tasks">과제 ${m.tasks.length}건</div>
      </div>`).join('');
}

// ── Status badge ──
function statusBadge(t) {
  const l={대기중:'대기',진행중:'진행',완료:'완료',보류:'보류'};
  const c={대기중:'wait',진행중:'progress',완료:'done',보류:'hold'};
  return `<span class="sbdg ${c[t.status]||'wait'}" onclick="event.stopPropagation();cycleStatus('${t.id}')">${l[t.status]||t.status}</span>`;
}

// ── Select task ──
function selectTask(id) {
  SEL = id; document.getElementById('detail-panel').classList.remove('collapsed');
  TAB = 'task'; document.getElementById('tn-task').classList.add('active');
  document.getElementById('tn-meet').classList.remove('active');
  renderTaskSidebar(); renderTaskList(); updateDetail();
}

function selectMeet(id) {
  SEL = id; document.getElementById('detail-panel').classList.remove('collapsed');
  TAB = 'meet'; document.getElementById('tn-meet').classList.add('active');
  document.getElementById('tn-task').classList.remove('active');
  renderMeetSidebar(); renderMeetList(); updateDetail();
}

function closeDetail() { SEL = null; document.getElementById('detail-panel').classList.add('collapsed'); render(); }

// ── Detail ──
function updateDetail() {
  if (!SEL) { document.getElementById('detail-panel').classList.add('collapsed'); return; }
  document.getElementById('detail-panel').classList.remove('collapsed');

  if (TAB==='task') renderTaskDetail();
  else renderMeetDetail();
}

function renderTaskDetail() {
  const t = apply(TASKS.find(t=>t.id===SEL)); if(!t)return;
  document.getElementById('detailTitle').textContent = t.id;
  const mid = t.meeting_id||t.meeting_date;
  const meet = mid ? MEETINGS.find(m=>m.id===mid) : null;
  const h = t._h||[];

  document.getElementById('detailBody').innerHTML = `
    <h5>기본 정보</h5>
    <div class="detail-field"><span class="flabel">제목</span><span class="fvalue" onclick="editDF('title')">${esc(t.title)}</span></div>
    <div class="detail-field"><span class="flabel">담당자</span><span class="fvalue" onclick="editDF('assignee')">${esc(t.assignee)}</span></div>
    <div class="detail-field"><span class="flabel">마감일</span><span class="fvalue" onclick="editDF('due_date')">${t.due_date||'미정'}</span></div>
    <div class="detail-field"><span class="flabel">우선순위</span><span class="fvalue" onclick="editDF('priority')">${pBdg(t.priority)}</span></div>
    <div class="detail-field"><span class="flabel">상태</span>
      <select onchange="updateF('status',this.value)">${STATUSES.map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${s}</option>`).join('')}</select>
    </div>

    ${meet ? `
    <h5>출처 회의</h5>
    <div class="linked-meet" onclick="switchTab('meet');selectMeet('${meet.id}')">
      📋 <strong>${esc(meet.date||meet.id.replace(/_/g,' '))}</strong>
      <span style="color:var(--muted);font-size:11px">${esc(meet.topics||'')}</span>
      <span style="margin-left:auto;font-size:10px;color:var(--accent)">클릭 → 회의록 보기</span>
    </div>` : ''}

    <h5>진행 히스토리</h5>
    <div class="tl">${h.map(e=>`<div class="tl-item"><div class="tl-time">${e.t}</div><div>${e.a}</div>${e.n?`<div class="tl-note">${esc(e.n)}</div>`:''}</div>`).join('')}</div>
    <textarea class="note-input" id="noteInput" placeholder="진행 노트 추가..."></textarea>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button class="btn sm primary" onclick="addNote()">노트 추가</button>
    </div>`;
}

function renderMeetDetail() {
  const m = MEETINGS.find(m=>m.id===SEL); if(!m)return;
  document.getElementById('detailTitle').textContent = '📋 회의록';
  const tasks = m.tasks.map(apply);

  document.getElementById('detailBody').innerHTML = `
    <div class="meet-detail-header"><h4>${esc(m.date||m.id.replace(/_/g,' '))}</h4></div>
    <div class="meta-tags" style="margin-bottom:12px">
      <div class="mtag">📅<span>${esc(m.date||m.id.replace(/_/g,' '))}</span></div>
      <div class="mtag">👥<span>${esc(m.participants||'')}</span></div>
      <div class="mtag">📌<span>${esc(m.topics||'')}</span></div>
    </div>
    <h5>회의 요약</h5>
    ${m.summary.length ? `<ul class="sum-list">${m.summary.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`
      : '<div style="color:var(--muted);font-size:12px;padding:8px 0">요약 없음</div>'}
    <h5>연결된 과제 (${tasks.length}건)</h5>
    ${tasks.length===0 ? '<div style="color:var(--muted);font-size:12px">없음</div>'
      : tasks.map(t=>`<div class="linked-meet" onclick="switchTab('task');selectTask('${t.id}')">
        <span class="tid">${t.id}</span> ${esc(t.title)}
        <span style="margin-left:auto;font-size:10px;color:var(--accent)">${t.status}</span>
      </div>`).join('')}`;
}

// ── Edit ──
function cycleStatus(id) {
  const t = apply(TASKS.find(t=>t.id===id));
  const i = STATUSES.indexOf(t.status);
  updateF.call({_sel:id}, 'status', STATUSES[(i+1)%STATUSES.length]);
  toast('✅ 상태 변경됨');
}

function updateF(field, value) {
  const id = this._sel||SEL; if(!id) return;
  const old = apply(TASKS.find(t=>t.id===id));
  if (old[field]===value) return;
  const e = EDIT[id]||{};
  e[field] = value;
  if (field==='status') e._ha = [...(e._ha||[]),{t:now(),a:`상태 → ${value}`,n:''}];
  else e._ha = [...(e._ha||[]),{t:now(),a:`${fl(field)} → ${value}`,n:''}];
  EDIT[id] = e; s(); render(); updateDetail();
  toast('✅ 저장됨');
}

function fl(f) { return {title:'제목',assignee:'담당자',due_date:'마감일',priority:'우선순위',status:'상태'}[f]||f; }

function editDF(field) {
  const t = apply(TASKS.find(t=>t.id===SEL)); if(!t) return;
  const d = prompt(`${fl(field)}:`, t[field]||'');
  if (d!==null && d!==t[field]) updateF(field, d);
}

function inlineEdit(id, field) {
  selectTask(id);
  const t = apply(TASKS.find(t=>t.id===id));
  const d = prompt(`${fl(field)}:`, t[field]||'');
  if (d!==null && d!==t[field]) updateF.call({_sel:id}, field, d);
}

function addNote() {
  const note = document.getElementById('noteInput')?.value?.trim();
  if (!note) return;
  const e = EDIT[SEL]||{};
  e._ha = [...(e._ha||[]),{t:now(),a:'노트',n:note}];
  EDIT[SEL]=e; s(); render(); updateDetail();
  toast('📝 노트 추가됨');
}

function addTask() {
  const title = document.getElementById('addTitle').value.trim(); if(!title) return;
  const ids = TASKS.map(t=>parseInt(t.id.slice(1))).filter(n=>!isNaN(n));
  const nid = `T${String((Math.max(0,...ids)+1)).padStart(3,'0')}`;
  EDIT[nid] = {
    title, assignee: document.getElementById('addAssignee').value.trim()||'미지정',
    due_date: document.getElementById('addDue').value||'미정',
    priority: document.getElementById('addPriority').value, status:'대기중',
    _ha:[{t:now(),a:'등록 (웹)',n:''}], _new:true
  };
  TASKS.push({id:nid,title:'',assignee:'',due_date:'',priority:'보통',status:'대기중',meeting_id:'',_h:[]});
  s(); closeModal('addModal'); SEL=nid; TAB='task'; render(); updateDetail();
  toast('✅ 추가됨');
}

// ── Filter ──
function setTaskFilter(f) { FILTER.task = f; SEL = null; document.getElementById('detail-panel').classList.add('collapsed'); render(); }

// ── Modal ──
function showModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
  if (id==='addModal') document.getElementById('addTitle').value=document.getElementById('addAssignee').value=document.getElementById('addDue').value='';
}

// ── Helpers ──
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pBdg(p){const m={높음:'pri-high',보통:'pri-mid',낮음:'pri-low'};return`<span class="pribdg ${m[p]||'pri-mid'}">${p||'보통'}</span>`}
function now() { return new Date().toLocaleString('ko-KR'); }
function toast(m) {
  const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show');
  clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1800);
}
function toggleMenu() {
  const sb=document.getElementById('sidebar'); sb.classList.toggle('open');
}

// Key bindings
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDetail();closeModal('addModal')}
});

boot();
</script>
</body>
</html>
