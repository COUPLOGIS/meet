<title>푸드레인 가격 레이더</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#F6F3EE; --surface:#FFFFFF; --surface2:#F0EBE3; --line:#E4DDD1; --line2:#D6CCBB;
  --ink:#2A2320; --ink2:#6B6157; --ink3:#9A8F82;
  --accent:#B8791E; --accent-soft:rgba(184,121,30,.12);
  --bad:#C4433A; --bad-soft:rgba(196,67,58,.10); --bad-line:rgba(196,67,58,.35);
  --good:#0E7C6B; --good-soft:rgba(14,124,107,.12);
  --shadow:0 6px 24px rgba(52,40,28,.10);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1B1815; --surface:#252019; --surface2:#2D271F; --line:#3A322A; --line2:#483f34;
    --ink:#F2ECE1; --ink2:#B9AE9E; --ink3:#8A7F70;
    --accent:#E0A04A; --accent-soft:rgba(224,160,74,.16);
    --bad:#E86A60; --bad-soft:rgba(232,106,96,.14); --bad-line:rgba(232,106,96,.4);
    --good:#3DB39C; --good-soft:rgba(61,179,156,.16);
    --shadow:0 6px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{
  --bg:#F6F3EE; --surface:#FFFFFF; --surface2:#F0EBE3; --line:#E4DDD1; --line2:#D6CCBB;
  --ink:#2A2320; --ink2:#6B6157; --ink3:#9A8F82;
  --accent:#B8791E; --accent-soft:rgba(184,121,30,.12);
  --bad:#C4433A; --bad-soft:rgba(196,67,58,.10); --bad-line:rgba(196,67,58,.35);
  --good:#0E7C6B; --good-soft:rgba(14,124,107,.12); --shadow:0 6px 24px rgba(52,40,28,.10);
}
:root[data-theme="dark"]{
  --bg:#1B1815; --surface:#252019; --surface2:#2D271F; --line:#3A322A; --line2:#483f34;
  --ink:#F2ECE1; --ink2:#B9AE9E; --ink3:#8A7F70;
  --accent:#E0A04A; --accent-soft:rgba(224,160,74,.16);
  --bad:#E86A60; --bad-soft:rgba(232,106,96,.14); --bad-line:rgba(232,106,96,.4);
  --good:#3DB39C; --good-soft:rgba(61,179,156,.16); --shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
.tnum{font-variant-numeric:tabular-nums}

/* 헤더 */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand .ey{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:3px}
.brand .sub{color:var(--ink2);font-size:13px;margin-top:4px}
.themebtn{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);
  border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.themebtn:hover{border-color:var(--accent);color:var(--accent)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.kpi .l{font-size:11.5px;color:var(--ink3);letter-spacing:.02em;font-weight:600}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1}
.kpi .u{font-size:13px;color:var(--ink3);font-weight:600;margin-left:2px}
.kpi.alert{background:var(--bad-soft);border-color:var(--bad-line)}
.kpi.alert .v{color:var(--bad)}

/* 경보 배너 */
.alertbar{display:flex;align-items:center;gap:12px;background:var(--bad-soft);
  border:1px solid var(--bad-line);border-radius:14px;padding:13px 17px;margin-bottom:22px}
.alertbar .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none;
  box-shadow:0 0 0 4px var(--bad-soft)}
.alertbar b{color:var(--bad)}
.alertbar .msg{font-size:13.5px;color:var(--ink)}

/* 섹션 */
section{margin-bottom:30px}
.shead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.shead h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.shead .n{font-size:12.5px;color:var(--ink3);font-weight:600}
.shead .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.search{border:1px solid var(--line2);background:var(--surface);border-radius:9px;
  padding:6px 11px;font-size:13px;color:var(--ink);width:150px}
.search::placeholder{color:var(--ink3)}
.filt{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);
  border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-weight:600;white-space:nowrap}
.filt.on{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}

/* 가격표 */
.tbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{font-size:11px;color:var(--ink3);font-weight:700;text-align:right;padding:11px 12px;
  letter-spacing:.02em;border-bottom:1.5px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none;background:var(--surface2)}
thead th:first-child{text-align:left}
thead th:hover{color:var(--accent)}
thead th .ar{opacity:0;font-size:9px;margin-left:3px}
thead th.sorted .ar{opacity:1;color:var(--accent)}
tbody td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td:first-child{text-align:left;white-space:normal;line-height:1.3;font-weight:600;
  color:var(--ink);min-width:150px;max-width:230px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
tr.behind td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.behind{background:var(--bad-soft)}
.our{font-weight:800;color:var(--ink)}
tr.behind .our{color:var(--bad)}
.low{color:var(--good);font-weight:800}
.low .st{font-size:9px;vertical-align:2px;margin-left:1px}
.na{color:var(--ink3)}
.gap{display:inline-block;font-size:11px;font-weight:800;color:var(--bad);
  background:var(--bad-soft);border-radius:6px;padding:1px 6px;margin-left:5px}
.code{font-size:10.5px;color:var(--ink3);font-weight:500;display:block;margin-top:2px}

/* 배너 */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  text-decoration:none;display:block;transition:transform .12s,border-color .12s}
.bcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.bcard img{width:100%;aspect-ratio:1.9;object-fit:cover;display:block;background:var(--surface2)}
.bcard .cap{padding:8px 10px;font-size:11.5px;color:var(--ink2);font-weight:600}
.mall-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);
  text-transform:uppercase;letter-spacing:.04em}

/* 가격 추이 차트 */
#trchart{overflow-x:auto}
.trlegend{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.trleg{color:var(--ink2);white-space:nowrap}
.trleg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* 신상품 */
.nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
/* 베이커리: 배너 한 줄 크게 + 신상품 이미지 썸네일 5열 */
.bgrid-bk{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bgrid-bk .bcard img{aspect-ratio:1.7}
.nthumb{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}
.nthumb a{text-decoration:none;display:block}
.nthumb img,.nthumb .noimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;
  border:1px solid var(--line);background:var(--surface2);display:block}
.nthumb .nm{font-size:12px;color:var(--ink);font-weight:600;margin-top:6px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nthumb a:hover .nm{color:var(--accent)}
@media (max-width:680px){
  .bgrid-bk{grid-template-columns:repeat(2,1fr)}
  .nthumb{grid-template-columns:repeat(3,1fr)}
}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  text-decoration:none;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:border-color .12s}
.ncard:hover{border-color:var(--accent)}
.ncard .nm{font-size:13px;color:var(--ink);font-weight:600;line-height:1.3}
.ncard .pr{font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}

footer{text-align:center;color:var(--ink3);font-size:12px;margin-top:36px;line-height:1.7}
footer a{color:var(--accent)}

@media (max-width:680px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .brand h1{font-size:22px}
  .shead .tools{width:100%;margin-left:0}
  .search{flex:1;width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const MALLS={mega:"메가커피",big:"빅커피",cnt:"CNT마트",oh:"오커피"};
const won=n=>n==null?"—":n.toLocaleString("ko-KR");
const shortName=s=>(s||"").replace(/^M(\([^)]*\)|[가-힣\w]+?_)/,"").replace(/[\s_][\d.,]+[a-zA-Z가-힣*/]+.*$/,"").trim()||s;

// KPI

  ["조사 완료",okCnt,"종",""],

// 표
let sortK="gap",sortAsc=false,fBehind=false,q="";
const gapOf=r=>(r.our&&r.low&&r.our>r.low)?(r.our/r.low-1):-1;
function render(){
  let rows=DATA.rows.filter(r=>{
    if(fBehind&&!r.behind)return false;
    if(q&&!(r.name||"").toLowerCase().includes(q)&&!(shortName(r.name)).toLowerCase().includes(q)&&!(r.brand||"").toLowerCase().includes(q))return false;
    return true;
  });
  rows.sort((a,b)=>{
    let x,y;
    if(sortK==="name"){x=shortName(a.name);y=shortName(b.name);return sortAsc?x.localeCompare(y):y.localeCompare(x);}
    if(sortK==="gap"){x=gapOf(a);y=gapOf(b);}
    else{x=a[sortK]??-1;y=b[sortK]??-1;}
    return sortAsc?x-y:y-x;
  });
  document.getElementById("tbody").innerHTML=rows.map(r=>{
    const cell=v=>v==null?'<td class="na">—</td>':`<td class="${v===r.low?'low':''}">${won(v)}${v===r.low?'<span class="st">★</span>':''}</td>`;
    const g=(r.our&&r.low&&r.our>r.low)?`<span class="gap">+${Math.round((r.our/r.low-1)*100)}%</span>`:'<span class="na">—</span>';
    return `<tr class="${r.behind?'behind':''}">
      <td>${shortName(r.name)}<span class="code">${r.brand?`<b style="color:var(--accent)">${r.brand}</b> · `:''}${r.code}</span></td>
      <td class="our">${won(r.our)}</td>
      ${cell(r.mega)}${cell(r.big)}${cell(r.cnt)}${cell(r.oh)}
      <td>${g}</td></tr>`;
  }).join("");
  document.getElementById("tcount").textContent=`${rows.length}종`;
  document.querySelectorAll("thead th").forEach(th=>{
    th.classList.toggle("sorted",th.dataset.k===sortK);
    const ar=th.querySelector(".ar");if(ar)ar.textContent=sortAsc?"▲":"▼";
  });
}
document.querySelectorAll("thead th").forEach(th=>th.onclick=()=>{
  const k=th.dataset.k;
  if(sortK===k)sortAsc=!sortAsc;else{sortK=k;sortAsc=(k==="name");}
  render();
});
document.getElementById("search").oninput=e=>{q=e.target.value.toLowerCase().trim();render();};
document.getElementById("fbehind").onclick=e=>{fBehind=!fBehind;e.target.classList.toggle("on",fBehind);render();};
render();

// 가격 추이 차트
const TCOL={our:"var(--accent)",mega:"#3D6FE8",big:"#159A62",cnt:"#7A5CC2",oh:"#0E9AAD"};
const TNAME={our:"푸드레인",mega:"메가커피",big:"빅커피",cnt:"CNT마트",oh:"오커피"};
const TKEYS=["our","mega","big","cnt","oh"];
function renderTrend(code){
  const h=(DATA.history||{})[code],dates=DATA.dates||[];
  const chart=document.getElementById("trchart"),leg=document.getElementById("trlegend");
  if(!h||dates.length<1){chart.innerHTML='<div class="na" style="padding:20px">이력 데이터가 아직 없습니다.</div>';leg.innerHTML="";return;}
  const all=[];TKEYS.forEach(k=>(h[k]||[]).forEach(v=>{if(v!=null)all.push(v)}));
  if(!all.length){chart.innerHTML='<div class="na" style="padding:20px">이 상품의 가격 이력이 없습니다.</div>';leg.innerHTML="";return;}
  let yMin=Math.min(...all),yMax=Math.max(...all);
  const pd=yMax===yMin?(yMax*0.08||100):(yMax-yMin)*0.18;yMin=Math.max(0,yMin-pd);yMax+=pd;
  const n=dates.length,W=Math.max(500,n*82),H=280,PL=56,PR=92,PT=14,PB=32,pw=W-PL-PR,ph=H-PT-PB;
  const x=i=>PL+(n<=1?pw/2:i*pw/(n-1)),y=v=>PT+ph-(v-yMin)/(yMax-yMin)*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">`;
  for(let g=0;g<=4;g++){const yv=yMin+(yMax-yMin)*g/4,yy=y(yv);
    s+=`<line x1="${PL}" y1="${yy.toFixed(1)}" x2="${W-PR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    s+=`<text x="${PL-7}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--ink3)">${Math.round(yv).toLocaleString()}</text>`;}
  dates.forEach((d,i)=>{s+=`<text x="${x(i).toFixed(1)}" y="${H-11}" text-anchor="middle" font-size="10" fill="var(--ink3)">${d.slice(5)}</text>`;});
  TKEYS.forEach(k=>{
    const pts=(h[k]||[]).map((v,i)=>v==null?null:[x(i),y(v)]);
    let dstr="",started=false;
    pts.forEach(p=>{if(!p){started=false;return}dstr+=(started?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)+" ";started=true});
    if(!dstr)return;
    const wide=k==="our";
    s+=`<path d="${dstr}" fill="none" stroke="${TCOL[k]}" stroke-width="${wide?3:2}" stroke-linejoin="round" stroke-linecap="round" opacity="${wide?1:.9}"/>`;
    pts.forEach(p=>{if(p)s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${wide?4:3}" fill="${TCOL[k]}" stroke="var(--surface)" stroke-width="1.5"/>`});
    const last=pts.filter(p=>p).pop();
    if(last)s+=`<text x="${(last[0]+7).toFixed(1)}" y="${(last[1]+3).toFixed(1)}" font-size="10.5" font-weight="${wide?800:600}" fill="${TCOL[k]}">${TNAME[k]}</text>`;
  });
  s+="</svg>";
  chart.innerHTML=s;
  leg.innerHTML=TKEYS.map(k=>`<span class="trleg"><i style="background:${TCOL[k]}"></i>${TNAME[k]}</span>`).join("");
}
(function(){
  const sel=document.getElementById("trsel");
  const items=[...DATA.rows].sort((a,b)=>(b.behind-a.behind)||shortName(a.name).localeCompare(shortName(b.name)));
  sel.innerHTML=items.map(r=>`<option value="${r.code}">${shortName(r.name,20)}${r.behind?" ⚠️":""}</option>`).join("");
  sel.onchange=()=>renderTrend(sel.value);
  if(items.length)renderTrend(items[0].code);
})();

const BKNAME={allbakery:"올베이커리",piececake:"파미유",rangcompany:"랑컴퍼니",goldenbrown:"골든브라운"};
if(typeof BK!=="undefined"&&BK){
  let h="";
  for(const k of ["allbakery","piececake","rangcompany"]){
    const v=BK[k];if(!v||(!v.banners.length&&!v.newitems.length))continue;
    h+=`<div style="margin-bottom:22px"><div style="font-weight:800;color:var(--accent);margin-bottom:9px">${BKNAME[k]||k}</div>`;
    if(v.banners.length)h+='<div class="bgrid-bk">'+v.banners.map(b=>
      `<a class="bcard" href="${b.link||'#'}" target="_blank" rel="noopener"><img src="${b.img}" alt="배너" loading="lazy">${b.title?`<div class="cap" style="color:var(--ink);font-weight:700">${b.title}</div>`:''}</a>`).join('')+'</div>';
    if(v.newitems.length)h+='<div class="nthumb">'+v.newitems.map(n=>
      `<a href="${n.url||'#'}" target="_blank" rel="noopener">${n.img?`<img src="${n.img}" alt="" loading="lazy">`:'<div class="noimg"></div>'}<span class="nm">${n.name}</span></a>`).join('')+'</div>';
    h+="</div>";
  }
